    // --- 完全修正版 デフォルメ路線図描画 ---
    function renderDeformedRouteMap() {
      const canvas = document.getElementById('deformed-canvas');
      const ctx = canvas.getContext('2d');
      const width = 1200, height = 800;
      canvas.width = width; canvas.height = height;
      ctx.fillStyle = '#181818'; ctx.fillRect(0, 0, width, height);
      if (stations.length === 0 || lines.length === 0) return;

      const bounds = map.getBounds();
      const minLat = bounds.getSouth(), maxLat = bounds.getNorth();
      const minLng = bounds.getWest(), maxLng = bounds.getEast();
      const latRange = (maxLat - minLat) || 0.01, lngRange = (maxLng - minLng) || 0.01;
      const margin = 100, effW = width - margin * 2, effH = height - margin * 2;

      const stationPos = {};
      stations.forEach(st => {
        let x = margin + ((st.latlng.lng - minLng) / lngRange) * effW;
        let y = height - (margin + ((st.latlng.lat - minLat) / latRange) * effH);
        stationPos[st.id] = { x, y, name: st.name, isHub: st.isHub };
      });

      lines.forEach(lineObj => {
        let sortedStations = stations.map(st => {
          let match = getNearestLineAndIndexOnLine(st.latlng, lineObj);
          return { st, idx: match.index, dist: match.dist };
        }).filter(item => item.dist < 800).sort((a, b) => a.idx - b.idx).map(item => item.st);

        if (sortedStations.length < 2) return;
        const folder = folders.find(f => f.id === lineObj.folderId);
        let lineColor = lineObj.isBranch ? (lineObj.color || '#ff9900') : ((folder && folder.isBranchFolder) ? folder.color : lineObj.color);

        ctx.strokeStyle = lineColor; ctx.lineWidth = lineObj.isBranch ? 3 : 5; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        ctx.beginPath();
        sortedStations.forEach((st, idx) => {
          let pos = stationPos[st.id];
          if (!pos) return;
          if (idx === 0) ctx.moveTo(pos.x, pos.y); else ctx.lineTo(pos.x, pos.y);
        });
        ctx.stroke();
      });

      Object.values(stationPos).forEach(pos => {
        ctx.fillStyle = pos.isHub ? '#20c997' : '#007acc'; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = pos.isHub ? 2.5 : 2;
        let r = pos.isHub ? 7 : 5;
        ctx.beginPath(); ctx.arc(pos.x, pos.y, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#ffffff'; ctx.font = '11px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
        ctx.fillText(pos.name, pos.x, pos.y - (r + 4));
      });
    }

    function downloadCurrentCapture() {
      let dataUrl = currentCaptureMode === 'deformed' ? document.getElementById('deformed-canvas').toDataURL('image/png') : document.getElementById('captured-image').src;
      if (!dataUrl) return;
      const a = document.createElement('a'); a.href = dataUrl; a.download = `route_map_${currentCaptureMode}.png`; a.click();
    }

    function getCharTypeScript(str) {
      if (!str || str.length === 0) return 3;
      const first = str.charAt(0);
      if (/^[ぁ-んァ-ン]/.test(first)) return 1;
      if (/^[\u4e00-\u9faf]/.test(first)) return 2;
      return 3;
    }

    function sortExpressTypes() {
      expressTypes.sort((a, b) => {
        if (a.isFixed) return -1; if (b.isFixed) return 1;
        let typeA = getCharTypeScript(a.name), typeB = getCharTypeScript(b.name);
        if (typeA !== typeB) return typeA - typeB;
        return a.name.localeCompare(b.name, 'ja');
      });
      renderExpressList();
    }

    let activeExpressConfigId = null;

    function addNewExpressType() {
      const name = prompt('速達種別名 (例: 特急):', `種別 ${expressTypes.length}`);
      if (!name) return;
      if (name === '各駅停車') return alert('「各駅停車」は既定です。');
      let newId = 'exp_' + Date.now();
      expressTypes.push({ id: newId, name, color: '#ff6600', isFixed: false });
      expressStops[newId] = {};
      stations.forEach(st => expressStops[newId][st.id] = 'stop');
      sortExpressTypes();
      selectExpressForConfig(newId);
    }

    function updateExpressConfig(id, newName, newColor) {
      const e = expressTypes.find(item => item.id === id);
      if (!e) return;
      if (e.isFixed && newName !== undefined) return alert('変更できません');
      if (newName !== undefined) e.name = newName;
      if (newColor !== undefined) e.color = newColor;
      sortExpressTypes();
      updateAllStationsConnection();
    }

    function deleteExpressType(id) {
      const e = expressTypes.find(item => item.id === id);
      if (e && e.isFixed) return alert('削除できません');
      if (!confirm(`「${e.name}」を削除しますか？`)) return;
      expressTypes = expressTypes.filter(item => item.id !== id);
      delete expressStops[id];
      if (activeExpressConfigId === id) activeExpressConfigId = null;
      renderExpressList();
      updateAllStationsConnection();
    }

    function selectExpressForConfig(id) {
      activeExpressConfigId = id;
      setMode('express-config');
      renderExpressList();
      updateAllStationsConnection();
    }

    function renderExpressList() {
      const container = document.getElementById('express-list-container');
      container.innerHTML = '';
      if (expressTypes.length === 0) {
        container.innerHTML = '<p style="font-size: 10px; color:#888;">種別なし</p>';
        return;
      }
      if (!activeExpressConfigId || !expressTypes.some(e => e.id === activeExpressConfigId)) {
        activeExpressConfigId = expressTypes[0].id;
      }

      expressTypes.forEach(e => {
        const item = document.createElement('div');
        item.className = 'express-item';
        let isSelected = activeExpressConfigId === e.id;

        if (isSelected) {
          item.style.background = '#252a34';
          item.style.border = '1px solid #00ffcc';
          item.style.padding = '5px';
          item.style.flexDirection = 'column';
          item.style.alignItems = 'stretch';
          item.style.gap = '4px';

          let totalSts = stations.length;
          let stopCount = (!e.isFixed && expressStops[e.id]) ? stations.filter(st => (expressStops[e.id][st.id] || 'stop') === 'stop').length : totalSts;

          item.innerHTML = `
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <span style="font-size:10px; color:#00ffcc; font-weight:bold;">✨ ${e.name} 設定中</span>
              <span style="font-size:9px; color:#ffcc00;">停車: ${stopCount}/${totalSts}</span>
            </div>
            <div style="display:flex; gap:4px; align-items:center;">
              <input type="color" class="folder-color-input" value="${e.color}" onchange="updateExpressConfig('${e.id}', undefined, this.value)">
              <input type="text" value="${e.name}" ${e.isFixed ? 'disabled style="background:#222; color:#aaa; margin:0; padding:2px; font-size:10px; flex:1;"' : 'style="margin:0; padding:2px; font-size:10px; flex:1;"'} onchange="updateExpressConfig('${e.id}', this.value, undefined)">
              ${e.isFixed ? '' : `<button onclick="deleteExpressType('${e.id}')" style="width:auto; font-size:9px; padding:2px 4px; background:#dc3545;">🗑️</button>`}
            </div>
          `;
        } else {
          item.style.background = '#1e1e1e';
          item.style.border = '1px solid #444';
          item.style.padding = '3px 4px';
          item.style.opacity = '0.6';

          item.innerHTML = `
            <span class="line-color-badge" style="background:${e.color}"></span>
            <span style="flex:1; font-size:10px; color:#ccc;">${e.name}</span>
            <button onclick="selectExpressForConfig('${e.id}')" style="font-size:9px; padding:1px 4px; background:#007acc;">選択</button>
          `;
        }
        container.appendChild(item);
      });
    }

    function addNewFolder() {
      const name = prompt('フォルダ名:', `グループ ${folders.length + 1}`);
      if (!name) return;
      folders.push({ id: Date.now(), name, color: '#ffcc00', isBranchFolder: false });
      renderLineList();
    }

    function updateFolderConfig(folderId, newName, newColor) {
      const f = folders.find(item => item.id === folderId);
      if (!f) return;
      if (newName !== undefined) f.name = newName;
      if (newColor !== undefined) f.color = newColor;
      lines.forEach(l => { if (l.folderId === folderId) updateLinePolylines(l); });
      renderLineList();
    }

    function toggleBranchFolder(folderId) {
      const f = folders.find(item => item.id === folderId);
      if (!f) return;
      f.isBranchFolder = !f.isBranchFolder;
      lines.forEach(l => { if (l.folderId === folderId) updateLinePolylines(l); });
      renderLineList();
    }

    function deleteFolder(folderId) {
      if (!confirm('フォルダを削除しますか？')) return;
      folders = folders.filter(f => f.id !== folderId);
      lines.forEach(l => { if (l.folderId === folderId) { l.folderId = null; updateLinePolylines(l); } });
      renderLineList();
    }

    function assignLineToFolder(lineId, folderIdStr) {
      const line = lines.find(l => l.id === lineId);
      if (!line) return;
      line.folderId = folderIdStr ? parseInt(folderIdStr, 10) : null;
      updateLinePolylines(line);
      renderLineList();
    }

    function toggleLineBranch(lineId) {
      const line = lines.find(l => l.id === lineId);
      if (!line) return;
      line.isBranch = !line.isBranch;
      updateLinePolylines(line);
      renderLineList();
    }

    function updateLinePolylines(lineObj) {
      if (lineObj.borderPolyline) map.removeLayer(lineObj.borderPolyline);
      if (lineObj.polyline) map.removeLayer(lineObj.polyline);
      const folder = folders.find(f => f.id === lineObj.folderId);
      
      let activeColor = lineObj.isBranch ? lineObj.color : ((folder && folder.isBranchFolder) ? folder.color : lineObj.color);
      let weight = lineObj.isBranch ? 3 : 4;
      let dashArray = lineObj.isBranch ? '4,2' : null;
      let borderColor = folder ? folder.color : null;

      if (borderColor && !lineObj.isBranch) {
        lineObj.borderPolyline = L.polyline(lineObj.points, { color: borderColor, weight: 7, opacity: 0.9 }).addTo(map);
      }
      lineObj.polyline = L.polyline(lineObj.points, { color: activeColor, weight: weight, dashArray: dashArray }).addTo(map);
      updateAllStationsConnection();
    }

    function finishCurrentLine() { discardCurrentDrawing(); }

    function discardCurrentDrawing() {
      if (currentPolyline) { map.removeLayer(currentPolyline); currentPolyline = null; }
      currentDrawingPoints = [];
      if (activePlanState.active) {
        if (activePlanState.ghostPolyline) map.removeLayer(activePlanState.ghostPolyline);
        if (activePlanState.solidPolyline) map.removeLayer(activePlanState.solidPolyline);
        activePlanState.active = false; activePlanState.isLocked = false;
        document.getElementById('finish-plan-btn').style.display = 'none';
      }
      setMode('pan');
    }

    function reverseLineDirection(lineId) {
      const l = lines.find(item => item.id === lineId);
      if (!l) return;
      l.points.reverse();
      updateLinePolylines(l);
    }

    function deleteLine(lineId) {
      const l = lines.find(item => item.id === lineId);
      if (!l) return;
      if (!confirm(`路線「${l.name}」を削除しますか？`)) return;
      if (l.polyline) map.removeLayer(l.polyline);
      if (l.borderPolyline) map.removeLayer(l.borderPolyline);
      lines = lines.filter(item => item.id !== lineId);
      updateAllStationsConnection();
      renderLineList();
    }

    function openTrimModal(lineId) {
      const l = lines.find(item => item.id === lineId);
      if (!l) return;
      trimTargetLineId = lineId;
      document.getElementById('trim-target-line-name').innerText = l.name;
      document.getElementById('trim-total-pts').innerText = l.points.length;
      document.getElementById('trim-count-input').value = Math.min(3, l.points.length - 2);
      document.getElementById('trim-modal').style.display = 'flex';
    }
    function closeTrimModal() { document.getElementById('trim-modal').style.display = 'none'; }

    function executeTrimLine() {
      const l = lines.find(item => item.id === trimTargetLineId);
      if (!l) return closeTrimModal();
      let count = parseInt(document.getElementById('trim-count-input').value, 10) || 1;
      let dir = document.getElementById('trim-direction').value;
      if (count >= l.points.length - 1) return alert('すべて削ることはできません');

      if (dir === 'end') l.points.splice(l.points.length - count, count);
      else l.points.splice(0, count);

      updateLinePolylines(l);
      closeTrimModal();
      renderLineList();
    }

    function startPlanMode(targetLineId = null) {
      activePlanState.active = true;
      activePlanState.targetLineId = targetLineId;
      activePlanState.rawPoints = []; activePlanState.currentIndex = 0; activePlanState.isLocked = false;

      if (activePlanState.ghostPolyline) map.removeLayer(activePlanState.ghostPolyline);
      if (activePlanState.solidPolyline) map.removeLayer(activePlanState.solidPolyline);

      activePlanState.ghostPolyline = L.polyline([], { color: '#666', weight: 3, dashArray: '4,4' }).addTo(map);
      activePlanState.solidPolyline = L.polyline([], { color: '#17a2b8', weight: 5 }).addTo(map);

      if (targetLineId) {
        const tLine = lines.find(l => l.id === targetLineId);
        if (tLine && tLine.points.length > 0) activePlanState.rawPoints.push(tLine.points[tLine.points.length - 1]);
      }

      setMode('plan');
      document.getElementById('finish-plan-btn').style.display = 'inline-flex';
    }

    function finishPlanLine() {
      if (!activePlanState.active || activePlanState.rawPoints.length < 2) return alert('計画線がありません');
      const solidPts = activePlanState.rawPoints.slice(0, activePlanState.currentIndex + 1);

      if (activePlanState.targetLineId) {
        const targetLine = lines.find(l => l.id === activePlanState.targetLineId);
        if (targetLine) {
          targetLine.points = targetLine.points.concat(solidPts.slice(1));
          updateLinePolylines(targetLine);
          discardCurrentDrawing();
          renderLineList();
          return;
        }
      }

      const planId = Date.now();
      const planObj = {
        id: planId, name: `計画 ${plannedLines.length + 1}`, points: solidPts,
        ghostPolyline: L.polyline(solidPts, { color: '#17a2b8', weight: 4, dashArray: '6,6', opacity: 0.8 }).addTo(map)
      };
      plannedLines.push(planObj);
      renderPlanList();
      discardCurrentDrawing();
    }

    function deletePlannedLine(planId) {
      const p = plannedLines.find(item => item.id === planId);
      if (p) {
        if (p.ghostPolyline) map.removeLayer(p.ghostPolyline);
        plannedLines = plannedLines.filter(item => item.id !== planId);
        renderPlanList();
      }
    }

    function promotePlannedLineToReal(planId) {
      const p = plannedLines.find(item => item.id === planId);
      if (!p) return;
      const lineObj = {
        id: Date.now(), name: p.name.replace('計画', '路線'), color: lineColors[lines.length % lineColors.length],
        folderId: null, isBranch: false, points: p.points, polyline: null, borderPolyline: null
      };
      lines.push(lineObj);
      updateLinePolylines(lineObj);
      deletePlannedLine(planId);
      renderLineList();
    }

    function renderPlanList() {
      const container = document.getElementById('plan-list-container');
      container.innerHTML = '';
      if (plannedLines.length === 0) {
        container.innerHTML = '<p style="font-size: 10px; color:#888;">計画線なし</p>';
        return;
      }
      plannedLines.forEach(p => {
        const item = document.createElement('div');
        item.className = 'plan-item';
        item.innerHTML = `
          <span style="color:#17a2b8; font-size:10px;">📐</span>
          <span style="flex:1; font-size:10px;">${p.name}</span>
          <button onclick="promotePlannedLineToReal(${p.id})" style="font-size:9px; padding:1px 4px; background:#28a745;">実線</button>
          <button onclick="deletePlannedLine(${p.id})" style="font-size:9px; padding:1px 4px; background:#d9534f;">🗑️</button>
        `;
        container.appendChild(item);
      });
    }

    function renderLineList() {
      const container = document.getElementById('line-list-container');
      container.innerHTML = '';
      if (lines.length === 0 && folders.length === 0) {
        container.innerHTML = '<p style="font-size: 10px; color:#888;">路線なし</p>';
        return;
      }
      folders.forEach(folder => {
        const folderDiv = document.createElement('div');
        folderDiv.className = 'folder-item';
        folderDiv.innerHTML = `
          <div class="folder-header">
            <span>📁</span>
            <input type="text" value="${folder.name}" style="margin:0; padding:1px 3px; font-size:10px;" onchange="updateFolderConfig(${folder.id}, this.value, undefined)">
            <input type="color" class="folder-color-input" value="${folder.color}" onchange="updateFolderConfig(${folder.id}, undefined, this.value)">
            <button onclick="toggleBranchFolder(${folder.id})" style="width:auto; padding:1px 4px; font-size:9px; background:${folder.isBranchFolder ? '#28a745' : '#444'};">${folder.isBranchFolder ? '支線' : '本線'}</button>
            <button onclick="deleteFolder(${folder.id})" style="width:auto; padding:1px 3px; font-size:9px; background:#dc3545;">🗑️</button>
          </div>
        `;
        lines.filter(l => l.folderId === folder.id).forEach(l => folderDiv.appendChild(createLineRowElement(l, true)));
        container.appendChild(folderDiv);
      });
      lines.filter(l => !l.folderId).forEach(l => container.appendChild(createLineRowElement(l, false)));
    }

    function createLineRowElement(lineObj, isInFolder) {
      const item = document.createElement('div');
      item.className = `line-item ${isInFolder ? 'in-folder' : ''}`;
      let folderOptions = `<option value="">(未分類)</option>`;
      folders.forEach(f => folderOptions += `<option value="${f.id}" ${lineObj.folderId === f.id ? 'selected' : ''}>📁 ${f.name}</option>`);

      item.innerHTML = `
        <span class="line-color-badge" style="background:${lineObj.color}"></span>
        <input type="text" value="${lineObj.name}" style="margin:0; padding:1px 2px; font-size:10px; width:55px;" onchange="updateLineName(${lineObj.id}, this.value)">
        <select style="margin:0; padding:1px; font-size:9px; width:auto; max-width:55px;" onchange="assignLineToFolder(${lineObj.id}, this.value)">${folderOptions}</select>
        <div style="display:flex; gap:1px; width:100%; margin-top:1px;">
          <button onclick="toggleLineBranch(${lineObj.id})" style="font-size:9px; padding:1px; background:${lineObj.isBranch ? '#28a745' : '#444'};">🌿</button>
          <button onclick="reverseLineDirection(${lineObj.id})" style="font-size:9px; padding:1px; background:#444;">🔄</button>
          <button onclick="startPlanMode(${lineObj.id})" style="font-size:9px; padding:1px; background:#17a2b8;">📐</button>
          <button onclick="openTrimModal(${lineObj.id})" style="font-size:9px; padding:1px; background:#e67e22;">✂️</button>
          <button onclick="deleteLine(${lineObj.id})" style="font-size:9px; padding:1px; background:#dc3545;">🗑️</button>
        </div>
      `;
      return item;
    }

    function updateLineName(lineId, newName) {
      const l = lines.find(item => item.id === lineId);
      if (l) l.name = newName;
    }

    const mapContainer = document.getElementById('map');

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Shift' && currentMode === 'plan' && activePlanState.active) {
        activePlanState.isLocked = !activePlanState.isLocked;
        document.getElementById('key-guide-box').innerHTML = `<span>${activePlanState.isLocked ? '🔒 計画線ロック中' : '📐 計画線'}</span>`;
      }
    });

    mapContainer.addEventListener('mousedown', (e) => {
      if (currentMode === 'plan' && activePlanState.active && !activePlanState.isLocked) {
        let pt = map.mouseEventToLatLng(e);
        activePlanState.rawPoints.push(pt);
        activePlanState.ghostPolyline.setLatLngs(activePlanState.rawPoints);
      }
    });

    mapContainer.addEventListener('mousemove', (e) => {
      if (currentMode === 'plan' && activePlanState.active && !activePlanState.isLocked) {
        let pt = map.mouseEventToLatLng(e);
        if (e.buttons === 1) {
          activePlanState.rawPoints.push(pt);
          activePlanState.ghostPolyline.setLatLngs(activePlanState.rawPoints);
        }
        if (activePlanState.rawPoints.length > 0) {
          let minD = Infinity, nearest = 0;
          activePlanState.rawPoints.forEach((p, idx) => {
            let d = p.distanceTo(pt);
            if (d < minD) { minD = d; nearest = idx; }
          });
          activePlanState.currentIndex = nearest;
          activePlanState.solidPolyline.setLatLngs(activePlanState.rawPoints.slice(0, activePlanState.currentIndex + 1));
        }
      }
    });

    function setMode(mode) {
      currentMode = mode;
      if (mode === 'pan') map.dragging.enable(); else map.dragging.disable();
      updateKeyGuide(mode);
    }

    function createStationMarkerIcon(expressTypeName = '', isHub = false, status = 'stop') {
      let isSpecial = expressTypeName && expressTypeName !== '各駅停車';
      let bgColor = '#007acc';
      if (isHub) bgColor = '#20c997';
      else if (isSpecial) {
        if (status === 'stop') bgColor = '#ff6600';     
        else if (status === 'pass') bgColor = '#555555'; 
        else if (status === 'no-entry') bgColor = '#d9534f'; 
      }
      let size = isHub ? 15 : 12;
      return L.divIcon({
        className: 'custom-station-icon',
        html: `<div class="station-marker ${isHub ? 'hub' : ''} ${status === 'no-entry' ? 'no-entry' : ''}" style="background:${bgColor};"></div>`,
        iconSize: [size, size], iconAnchor: [size/2, size/2]
      });
    }

    function updateAllStationsConnection() {
      stations.forEach(st => {
        let connected = [];
        lines.forEach(l => {
          let m = getNearestLineAndIndexOnLine(st.latlng, l);
          if (m.dist < 500) connected.push(l.id);
        });
        st.connectedLineIds = connected;
        if (st.connectedLineIds.length >= 2) st.isHub = true;

        let currentExp = expressTypes.find(e => e.id === activeExpressConfigId);
        let expName = currentExp ? currentExp.name : '各駅停車';
        let stStatus = (currentExp && !currentExp.isFixed && expressStops[currentExp.id]) ? (expressStops[currentExp.id][st.id] || 'stop') : 'stop';

        st.marker.setIcon(createStationMarkerIcon(expName, st.isHub, stStatus));
        let statusLabels = { 'stop': '停', 'pass': '通', 'no-entry': '禁' };
        let statusText = currentExp && !currentExp.isFixed ? ` (${statusLabels[stStatus] || stStatus})` : '';
        st.marker.bindTooltip(`${st.name}${statusText}`, { permanent: true, direction: 'top' });
      });
    }

    map.on('click', (e) => {
      if (currentMode === 'station') {
        const name = prompt('駅名:', `駅 ${stations.length + 1}`);
        if (!name) return;
        const marker = L.marker(e.latlng, { icon: createStationMarkerIcon('各駅停車', false, 'stop'), draggable: true }).addTo(map);
        marker.bindTooltip(name, { permanent: true, direction: 'top' });
        const st = { id: Date.now() + Math.random(), name, marker, latlng: e.latlng, isHub: false, mergedStationIds: [], connectedLineIds: [] };
        stations.push(st);
        
        expressTypes.forEach(et => {
          if (!et.isFixed) {
            if (!expressStops[et.id]) expressStops[et.id] = {};
            expressStops[et.id][st.id] = 'stop';
          }
        });
        marker.on('click', (evt) => handleStationClick(evt, st));
        updateAllStationsConnection();
      }
    });

    function deleteStation(stId) {
      let st = stations.find(s => s.id === stId);
      if (!st) return;
      if (!confirm(`駅「${st.name}」を削除しますか？`)) return;
      map.removeLayer(st.marker);
      stations = stations.filter(s => s.id !== stId);
      updateAllStationsConnection();
    }

    function handleStationClick(evt, st) {
      if (evt) L.DomEvent.stopPropagation(evt);
      
      if (currentMode === 'express-config') {
        if (!activeExpressConfigId) return alert('種別を選択してください');
        let exp = expressTypes.find(e => e.id === activeExpressConfigId);
        if (exp && exp.isFixed) return alert('各駅停車は変更できません');

        if (!expressStops[activeExpressConfigId]) expressStops[activeExpressConfigId] = {};
        let curStatus = expressStops[activeExpressConfigId][st.id] || 'stop';
        let nextStatus = 'stop';
        if (curStatus === 'stop') nextStatus = 'pass';
        else if (curStatus === 'pass') nextStatus = 'no-entry';
        else if (curStatus === 'no-entry') nextStatus = 'stop';

        expressStops[activeExpressConfigId][st.id] = nextStatus;
        updateAllStationsConnection();
        renderExpressList();
        return;
      }

      if (currentMode === 'transfer') {
        if (!transferFirstStation) {
          transferFirstStation = st;
          alert(`1つ目「${st.name}」選択。もう1つの駅をクリック。`);
        } else {
          let first = transferFirstStation;
          transferFirstStation = null;
          if (first.id === st.id) return;
          let newName = prompt('統合後の駅名:', `${first.name}・${st.name}`);
          if (!newName) return;

          st.name = newName; st.isHub = true;
          st.mergedStationIds.push(first.id);
          st.marker.setIcon(createStationMarkerIcon('各駅停車', true, 'stop'));
          map.removeLayer(first.marker);
          stations = stations.filter(s => s.id !== first.id);
          updateAllStationsConnection();
        }
        return;
      }

      if (currentMode === 'pan') {
        let action = prompt(`[1] 改名 [2] 削除`, "1");
        if (action === "1") {
          let newName = prompt("新しい駅名:", st.name);
          if (newName) { st.name = newName; updateAllStationsConnection(); }
        } else if (action === "2") { deleteStation(st.id); }
        return;
      }

      if (currentMode === 'start') { getActiveTrain().startStation = st; document.getElementById('start-name').innerText = st.name; }
      else if (currentMode === 'end') { getActiveTrain().endStation = st; document.getElementById('end-name').innerText = st.name; }
      else if (currentMode === 'via') { getActiveTrain().viaStations.push(st); updateViaDisplay(); }
    }

    function updateViaDisplay() {
      const t = getActiveTrain();
      if (t) document.getElementById('via-names').innerText = t.viaStations.length === 0 ? 'なし' : t.viaStations.map(s => s.name).join('→');
    }

    function clearViaStations() {
      const t = getActiveTrain();
      if (t) { t.viaStations = []; updateViaDisplay(); }
    }

    function createNewTrainObject(id, name) {
      return { id, name, startStation: null, viaStations: [], endStation: null, expressName: '各駅停車', speedKmH: 60, stopTimeSec: 3, timetable: [], marker: null };
    }
    function addNewTrain() {
      let t = createNewTrainObject(Date.now(), `列車 ${trainList.length + 1}`);
      trainList.push(t);
      selectTrain(t.id);
    }
    function selectTrain(id) { activeTrainId = id; renderTrainTabs(); loadActiveTrainToUI(); }
    function renderTrainTabs() {
      const c = document.getElementById('train-tabs-container'); c.innerHTML = '';
      trainList.forEach(t => {
        let b = document.createElement('button');
        b.className = `train-tab ${t.id === activeTrainId ? 'active' : ''}`;
        b.innerText = t.name; b.onclick = () => selectTrain(t.id);
        c.appendChild(b);
      });
    }
    function getActiveTrain() { return trainList.find(t => t.id === activeTrainId); }
    function loadActiveTrainToUI() {
      let t = getActiveTrain();
      if (!t) return;
      document.getElementById('active-train-title').innerText = t.name;
      document.getElementById('start-name').innerText = t.startStation ? t.startStation.name : '未設定';
      document.getElementById('end-name').innerText = t.endStation ? t.endStation.name : '未設定';
      document.getElementById('train-express-name').value = t.expressName || '各駅停車';
      document.getElementById('train-speed').value = t.speedKmH;
      document.getElementById('stop-time').value = t.stopTimeSec;
      updateViaDisplay();
    }
    function updateActiveTrainConfig() {
      let t = getActiveTrain();
      if (!t) return;
      t.expressName = document.getElementById('train-express-name').value.trim();
      t.speedKmH = parseFloat(document.getElementById('train-speed').value) || 60;
      t.stopTimeSec = parseInt(document.getElementById('stop-time').value, 10) || 3;
    }

    function findAllPossibleRouteStations(startSt, endSt, trainExpressName) {
      let adj = {};
      stations.forEach(s => { adj[s.id] = []; });

      lines.forEach(lineObj => {
        let lineSts = stations.filter(st => getNearestLineAndIndexOnLine(st.latlng, lineObj).dist < 500)
          .sort((a, b) => getNearestLineAndIndexOnLine(a.latlng, lineObj).index - getNearestLineAndIndexOnLine(b.latlng, lineObj).index);
        
        for (let i = 0; i < lineSts.length - 1; i++) {
          let u = lineSts[i].id, v = lineSts[i+1].id;
          if (!adj[u].includes(v)) adj[u].push(v);
          if (!adj[v].includes(u)) adj[v].push(u);
        }
      });

      for (let i = 0; i < stations.length; i++) {
        for (let j = i + 1; j < stations.length; j++) {
          let s1 = stations[i], s2 = stations[j];
          if (s1.latlng.distanceTo(s2.latlng) < 500) {
            if (!adj[s1.id].includes(s2.id)) adj[s1.id].push(s2.id);
            if (!adj[s2.id].includes(s1.id)) adj[s2.id].push(s1.id);
          }
        }
      }

      let stMap = {};
      stations.forEach(s => { stMap[s.id] = s; });

      let expType = expressTypes.find(e => e.name === trainExpressName);
      let stopsConfig = (expType && expressStops[expType.id]) ? expressStops[expType.id] : {};

      let allPaths = [];
      function dfs(currId, targetId, visited, path) {
        if (currId === targetId) { allPaths.push([...path]); return; }
        if (path.length > 40) return;
        for (let nextId of (adj[currId] || [])) {
          if (!visited.has(nextId)) {
            let isTerminal = (nextId === targetId);
            let status = stopsConfig[nextId] || 'stop';
            if (!isTerminal && status === 'no-entry') continue;

            visited.add(nextId);
            path.push(stMap[nextId]);
            dfs(nextId, targetId, visited, path);
            path.pop();
            visited.delete(nextId);
          }
        }
      }

      let visited = new Set([startSt.id]);
      dfs(startSt.id, endSt.id, visited, [startSt]);
      return allPaths;
    }

    function getFullRouteStationsForTrain(t) {
      if (!t.startStation || !t.endStation) return [];
      let candidatePaths = findAllPossibleRouteStations(t.startStation, t.endStation, t.expressName);
      let expType = expressTypes.find(e => e.name === t.expressName);
      let stopsConfig = (expType && expressStops[expType.id]) ? expressStops[expType.id] : {};

      let validPath = null;
      for (let path of candidatePaths) {
        let hasNoEntry = false;
        for (let i = 0; i < path.length; i++) {
          let st = path[i];
          let isTerminal = (i === 0 || i === path.length - 1);
          let status = stopsConfig[st.id] || 'stop';
          if (!isTerminal && status === 'no-entry') { hasNoEntry = true; break; }
        }
        if (!hasNoEntry) { validPath = path; break; }
      }
      return validPath;
    }

    function generateTimetableForActiveTrain() {
      const t = getActiveTrain();
      if (!t || !t.startStation || !t.endStation) return alert('始点と終点を設定してください');

      let rawRouteStations = getFullRouteStationsForTrain(t);
      if (!rawRouteStations) {
        alert('❌ 【ルート探索失敗】\n有効なルート上に進入禁止駅が含まれているか、到達可能な路線がつながっていません。');
        return;
      }

      let routeStations = [];
      let expType = expressTypes.find(e => e.name === t.expressName);
      let stopsConfig = (expType && expressStops[expType.id]) ? expressStops[expType.id] : {};

      rawRouteStations.forEach((st, idx) => {
        let isTerminal = (idx === 0 || idx === rawRouteStations.length - 1);
        if (isTerminal) { routeStations.push(st); return; }

        let status = stopsConfig[st.id] || 'stop';
        if (t.expressName === '各駅停車') {
          if (status !== 'pass' && status !== 'no-entry') routeStations.push(st);
        } else {
          if (status === 'stop') routeStations.push(st);
        }
      });

      let tbody = document.getElementById('timetable-body');
      tbody.innerHTML = '';
      t.timetable = [];

      let currentTime = document.getElementById('timetable-start-time').value || '08:00';
      let [h, m] = currentTime.split(':').map(Number);
      let totalSec = h * 3600 + m * 60;

      routeStations.forEach((st, idx) => {
        let travelSec = 60;
        if (idx > 0) {
          let prevSt = routeStations[idx - 1];
          let segPoints = findLineSegmentBetweenStations(prevSt, st);
          let distMeters = 0;
          for (let i = 0; i < segPoints.length - 1; i++) distMeters += segPoints[i].distanceTo(segPoints[i+1]);
          let distKm = distMeters / 1000;
          let speedKmH = t.speedKmH || 60;
          travelSec = Math.max(30, Math.round((distKm / speedKmH) * 3600 + 20));
        }

        let arrSec = idx === 0 ? totalSec : totalSec + travelSec;
        let depSec = arrSec + (idx === routeStations.length - 1 ? 0 : t.stopTimeSec);
        totalSec = depSec;

        let arrStr = `${String(Math.floor(arrSec/3600)%24).padStart(2,'0')}:${String(Math.floor((arrSec%3600)/60)).padStart(2,'0')}`;
        let depStr = `${String(Math.floor(depSec/3600)%24).padStart(2,'0')}:${String(Math.floor((depSec%3600)/60)).padStart(2,'0')}`;

        t.timetable.push({ station: st, arr: arrStr, dep: depStr });
        let row = document.createElement('tr');
        row.innerHTML = `<td>${st.name}</td><td>${arrStr}</td><td>${depStr}</td>`;
        tbody.appendChild(row);
      });

      alert(`ダイヤ生成完了（停車駅数: ${routeStations.length}駅）`);
      renderLEDPreview(t);
    }

    // --- 車内表示機LED 16x16プレビュー修復描画 ---
    function renderLEDPreview(train) {
      const container = document.getElementById('display-text');
      container.innerHTML = '';
      if (!train.timetable || train.timetable.length === 0) return;

      let textToShow = `${train.expressName} 至 ${train.endStation ? train.endStation.name : '未設定'}`;
      
      for (let i = 0; i < textToShow.length; i++) {
        let char = textToShow.charAt(i);
        let matrix = document.createElement('div');
        matrix.className = 'char-matrix';
        
        let fontMatrix = customFontData[char];
        for (let r = 0; r < 16; r++) {
          let rowVal = fontMatrix ? fontMatrix[r] : getDefaultCharBitmap(char, r);
          for (let c = 0; c < 16; c++) {
            let px = document.createElement('div');
            let isOn = (rowVal & (1 << (15 - c))) !== 0;
            px.className = 'pixel' + (isOn ? ' on' : '');
            matrix.appendChild(px);
          }
        }
        container.appendChild(matrix);
      }
    }

    function getDefaultCharBitmap(char, row) {
      // 簡易フォントフォールバック（文字がない場合のドットパターン）
      if (char === '各' || char === '停' || char === '車' || char === '特' || char === '急') {
        return 0b0111111001111110;
      }
      return (row % 2 === 0 && row > 3 && row < 12) ? 0b0011110000111100 : 0;
    }

    addNewTrain();
    renderExpressList();
  </script>
</body>
</html>
