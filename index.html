<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>電車内表示器エディタ v4.50 (完全修復・漢字エディタ搭載版)</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.4.4/lz-string.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100vw; height: 100vh; overflow: hidden; background: #1a1a1a; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; }
    
    header { background: #2a2a2a; padding: 4px 8px; display: flex; gap: 4px; align-items: center; border-bottom: 2px solid #444; z-index: 1000; flex-wrap: wrap; height: auto; min-height: 42px; flex-shrink: 0; width: 100vw; }
    .header-group { display: flex; align-items: center; gap: 4px; }
    
    .mode-select {
      background: #333; color: #fff; border: 1px solid #007acc; padding: 3px 6px; border-radius: 4px; font-size: 11px; font-weight: bold; cursor: pointer; outline: none; min-width: 120px;
    }
    .mode-select:focus { border-color: #0098ff; }

    .header-btn {
      background: #333; color: #fff; border: 1px solid #555; padding: 3px 6px; border-radius: 4px; cursor: pointer; display: flex; align-items: center; gap: 2px; font-size: 10px; white-space: nowrap; margin: 0; width: auto;
    }
    .header-btn:hover { background: #444; }
    .header-btn.success { background: #28a745; border-color: #34ce57; font-weight: bold; }
    .header-btn.toggle-on { background: #ff9900; border-color: #ffaa00; font-weight: bold; color: #000; }
    .header-btn.capture { background: #911eb4; border-color: #b152d2; font-weight: bold; }
    .header-btn.plan { background: #17a2b8; border-color: #20c997; font-weight: bold; }
    .header-btn.danger { background: #d9534f; border-color: #c9302c; font-weight: bold; }
    .header-btn.optimize { background: #e67e22; border-color: #d35400; font-weight: bold; color: #fff; }
    .header-btn.online-share { background: #20c997; color: #000; font-weight: bold; }
    .header-btn.online-browse { background: #ffc107; color: #000; font-weight: bold; }
    .header-btn.test-run { background: #00ffcc; color: #000; font-weight: bold; }
    .header-btn.font-edit { background: #ff00ff; color: #fff; font-weight: bold; }

    .key-guide-box {
      background: #1e1e1e; border: 1px solid #00aaff; border-radius: 4px; padding: 2px 6px; font-size: 10px; color: #00ffcc; display: flex; align-items: center; gap: 4px; white-space: nowrap; max-width: 300px; overflow: hidden; text-overflow: ellipsis;
    }

    #main-container { flex: 1; display: flex; width: 100vw; height: calc(100vh - 42px); position: relative; overflow: hidden; }
    #map { flex: 1; height: 100%; background: #222; }

    #sidebar { width: 320px; background: #222; border-left: 2px solid #444; display: flex; flex-direction: column; gap: 6px; padding: 6px; overflow-y: auto; z-index: 1000; flex-shrink: 0; height: 100%; }
    .panel { background: #2a2a2a; border: 1px solid #444; border-radius: 4px; padding: 6px; }
    .panel h3 { font-size: 12px; margin-bottom: 6px; color: #00aaff; border-bottom: 1px solid #444; padding-bottom: 3px; display: flex; justify-content: space-between; align-items: center; }

    /* 車内表示機LEDボードの修正 */
    #display-preview { background: #000; border: 2px solid #333; border-radius: 4px; padding: 6px; text-align: center; }
    .led-board { background: #111; border: 1px solid #222; padding: 6px; display: flex; justify-content: flex-start; align-items: center; min-height: 60px; overflow-x: auto; }
    .led-grid { display: flex; gap: 2px; justify-content: flex-start; background: #050505; padding: 4px; border-radius: 3px; }
    .char-matrix { display: grid; grid-template-columns: repeat(16, 7px); grid-template-rows: repeat(16, 7px); gap: 1px; flex-shrink: 0; background: #000; padding: 1px; border: 1px solid #222; }
    .pixel { width: 7px; height: 7px; background: #1a1a1a; border-radius: 1px; }
    .pixel.on { background: #00ff66; box-shadow: 0 0 2px #00ff66; }

    select, input, button { background: #333; color: #fff; border: 1px solid #555; padding: 4px; border-radius: 3px; width: 100%; margin-bottom: 4px; font-size: 11px; }
    button { cursor: pointer; background: #007acc; border: none; font-weight: bold; }
    button:hover { background: #0098ff; }
    
    .station-marker { width: 12px; height: 12px; border-radius: 50%; background: #007acc; border: 2px solid #fff; box-shadow: 0 0 3px rgba(0,0,0,0.5); cursor: pointer; }
    .station-marker.stop { background: #ff6600; border-color: #ffff00; }
    .station-marker.pass { background: #555555; border-color: #888; }
    .station-marker.no-entry { background: #d9534f; border-color: #fff; box-shadow: 0 0 4px #d9534f; }
    .station-marker.hub { background: #20c997; border-color: #fff; box-shadow: 0 0 6px #20c997; width: 15px; height: 15px; margin-left: -1.5px; margin-top: -1.5px; }

    .train-marker { width: 14px; height: 14px; border-radius: 50%; background: #ffcc00; border: 2px solid #fff; box-shadow: 0 0 6px #ffcc00; z-index: 1500; }

    .timetable-table { width: 100%; border-collapse: collapse; font-size: 10px; margin-top: 4px; }
    .timetable-table th, .timetable-table td { border: 1px solid #444; padding: 2px; text-align: center; }
    .timetable-table th { background: #333; color: #00aaff; }

    .folder-item { background: #333; border: 1px dashed #666; border-radius: 3px; padding: 4px; margin-bottom: 4px; }
    .folder-header { display: flex; align-items: center; gap: 4px; margin-bottom: 2px; }
    .folder-color-input { width: 20px !important; height: 20px !important; padding: 0 !important; margin: 0 !important; cursor: pointer; border: none; }
    .line-item, .plan-item, .express-item { display: flex; align-items: center; gap: 3px; margin-bottom: 3px; background: #1e1e1e; padding: 3px; border-radius: 3px; flex-wrap: wrap; }
    .line-item.in-folder { margin-left: 10px; border-left: 2px solid #555; }
    .line-color-badge { width: 10px; height: 10px; border-radius: 30%; display: inline-block; flex-shrink: 0; }

    .train-tab { background: #333; border: 1px solid #555; padding: 3px 6px; font-size: 10px; cursor: pointer; border-radius: 3px 3px 0 0; }
    .train-tab.active { background: #007acc; font-weight: bold; }

    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.9); z-index: 3000; justify-content: center; align-items: center; padding: 15px; }
    .modal-content-fullscreen { background: #222; border: 2px solid #555; border-radius: 6px; padding: 12px; width: 98vw; height: 95vh; display: flex; flex-direction: column; gap: 8px; overflow: hidden; }
    .modal-content-normal { background: #222; border: 2px solid #555; border-radius: 6px; padding: 12px; width: 95vw; max-width: 500px; display: flex; flex-direction: column; gap: 8px; }

    .works-grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; flex: 1; overflow-y: auto; padding: 2px; }
    .work-card { background: #2a2a2a; border: 1px solid #444; border-radius: 4px; padding: 8px; display: flex; flex-direction: column; justify-content: space-between; gap: 4px; font-size: 10px; }
    .work-card-header { display: flex; justify-content: space-between; align-items: center; }
    .tag-badge { background: #17a2b8; color: #fff; padding: 1px 3px; border-radius: 2px; font-size: 8px; display: inline-block; margin-right: 2px; }

    /* 16x16 漢字エディタ専用スタイル */
    .editor-grid-16 {
      display: grid;
      grid-template-columns: repeat(16, 22px);
      grid-template-rows: repeat(16, 22px);
      gap: 1px;
      background: #111;
      border: 2px solid #444;
      padding: 4px;
      margin: 0 auto;
      touch-action: none;
    }
    .editor-pixel {
      width: 22px;
      height: 22px;
      background: #222;
      border-radius: 2px;
      cursor: pointer;
    }
    .editor-pixel.on {
      background: #00ff66;
      box-shadow: 0 0 3px #00ff66;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-group">
      <select id="mode-select" class="mode-select" onchange="setMode(this.value)">
        <option value="pan">✋ 地図移動</option>
        <option value="plan">📐 計画線・延長</option>
        <option value="station">🚉 駅配置</option>
        <option value="transfer">🔄 乗換統合</option>
        <option value="start">🟢 始点設定</option>
        <option value="via">🟨 経由地設定</option>
        <option value="end">🔴 終点設定</option>
        <option value="express-config">⚡ 種別停車設定</option>
      </select>
    </div>

    <div id="key-guide-box" class="key-guide-box"><span>✋ 地図移動モード</span></div>

    <button class="header-btn plan" onclick="startPlanMode()">📐 計画線</button>
    <button class="header-btn success" id="finish-plan-btn" style="display:none; background:#20c997;" onclick="finishPlanLine()">📌 確定</button>
    <button class="header-btn success" id="finish-line-btn" style="display:none; background:#28a745;" onclick="finishCurrentLine()">✅ 路線確定</button>
    <button class="header-btn danger" onclick="discardCurrentDrawing()" title="破棄">🗑️</button>

    <div style="display:flex; align-items:center; gap:2px; background:#222; padding:1px 4px; border-radius:3px; border:1px solid #555;">
      <span style="font-size:9px; color:#aaa;">間引:</span>
      <input type="number" id="simplify-distance-input" value="50" min="5" max="500" step="5" style="width:38px; margin:0; padding:1px; font-size:10px; text-align:center; background:#111; color:#fff; border:1px solid #444;">
      <span style="font-size:9px; color:#aaa;">m</span>
    </div>
    <button class="header-btn optimize" onclick="optimizeAllLinesPoints()" title="間引き実行">🧹</button>

    <button class="header-btn font-edit" onclick="openFontEditorModal()">🔤 16x16フォント</button>
    <button id="track-btn" class="header-btn" onclick="toggleTracking()">🎥 追尾</button>
    <button id="audio-btn" class="header-btn" onclick="toggleAudio()">🔊 音声</button>
    <button id="test-run-btn" class="header-btn test-run" onclick="toggleTestRun()">▶ 試運転</button>
    <button class="header-btn capture" onclick="openCaptureModal()">📸 出力</button>

    <div style="margin-left: auto; display: flex; gap: 4px;">
      <button class="header-btn online-share" onclick="openShareModal()">🌐 共有</button>
      <button class="header-btn online-browse" onclick="openBrowseModal()">📖 一覧</button>
      <button class="header-btn" onclick="exportJSON()" style="background:#28a745;">💾 JSON</button>
      <button class="header-btn" onclick="importJSON('overwrite')" style="background:#d9534f;" title="上書き">📂 上書</button>
      <button class="header-btn" onclick="importJSON('append')" style="background:#f0ad4e;" title="追加">📂 追加</button>
    </div>
  </header>

  <div id="main-container">
    <div id="map"></div>

    <div id="sidebar">
      <div class="panel">
        <h3>
          ⚡ 種別設定
          <button onclick="addNewExpressType()" style="width:auto; padding:1px 4px; font-size:10px;">➕ 追加</button>
        </h3>
        <div id="express-list-container" style="max-height: 140px; overflow-y: auto;">
          <p style="font-size: 10px; color:#888;">速達種別なし</p>
        </div>
      </div>

      <div class="panel">
        <h3>
          🛤 路線・フォルダ
          <button onclick="addNewFolder()" style="width:auto; padding:1px 4px; font-size:10px;">➕ フォルダ</button>
        </h3>
        <div id="line-list-container" style="max-height: 110px; overflow-y: auto;">
          <p style="font-size: 10px; color:#888;">路線なし</p>
        </div>
      </div>

      <div class="panel">
        <h3>
          📐 計画線
          <button onclick="startPlanMode()" style="width:auto; padding:1px 4px; font-size:10px; background:#17a2b8;">➕ 追加</button>
        </h3>
        <div id="plan-list-container" style="max-height: 70px; overflow-y: auto;">
          <p style="font-size: 10px; color:#888;">計画線なし</p>
        </div>
      </div>

      <div class="panel">
        <h3>
          🚃 列車運行
          <button onclick="addNewTrain()" style="width:auto; padding:1px 4px; font-size:10px;">➕ 列車</button>
        </h3>
        <div id="train-tabs-container" style="display:flex; gap:2px; margin-bottom:4px; overflow-x:auto;"></div>

        <div id="train-editor-content">
          <p style="font-size:10px;">選択: <b id="active-train-title" style="color:#00aaff">列車 1</b></p>
          <p style="font-size:10px;">始点: <span id="start-name" style="color:#00ff66">未設定</span></p>
          <p style="font-size:10px;">経由: <span id="via-names" style="color:#ffcc00">なし</span> <button onclick="clearViaStations()" style="width:auto; padding:1px 3px; font-size:9px;">クリア</button></p>
          <p style="font-size:10px;">終点: <span id="end-name" style="color:#ff4444">未設定</span></p>
          
          <div style="margin-top: 3px;">
            <label style="font-size: 10px;">速達種別名:</label>
            <input type="text" id="train-express-name" value="各駅停車" onchange="updateActiveTrainConfig()" style="padding:2px; font-size:10px;">
          </div>

          <div style="display:flex; gap:4px; margin-top:3px;">
            <div style="flex:1;">
              <label style="font-size: 9px;">最高速度(km/h):</label>
              <input type="number" id="train-speed" value="60" min="10" max="300" onchange="updateActiveTrainConfig()" style="padding:2px; font-size:10px;">
            </div>
            <div style="flex:1;">
              <label style="font-size: 9px;">停車時間(秒):</label>
              <input type="number" id="stop-time" value="3" min="0" max="60" onchange="updateActiveTrainConfig()" style="padding:2px; font-size:10px;">
            </div>
          </div>
        </div>
      </div>

      <div class="panel">
        <h3>📅 ダイヤ制御</h3>
        <div style="display:flex; gap:4px;">
          <div style="flex:1;">
            <label style="font-size:9px;">始発発車:</label>
            <input type="time" id="timetable-start-time" value="08:00" style="padding:2px; font-size:10px;">
          </div>
          <div style="flex:1;">
            <label style="font-size:9px;">基準走行(秒):</label>
            <input type="number" id="default-travel-sec" value="60" min="10" style="padding:2px; font-size:10px;">
          </div>
        </div>
        <button onclick="generateTimetableForActiveTrain()" style="background:#17a2b8; padding:4px; font-size:10px;">🔄 ダイヤ生成</button>
        
        <div style="max-height: 70px; overflow-y: auto; margin-top: 3px;">
          <table class="timetable-table">
            <thead>
              <tr><th>駅名</th><th>着</th><th>発</th></tr>
            </thead>
            <tbody id="timetable-body">
              <tr><td colspan="3" style="color:#888;">ダイヤ未作成</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <div class="panel">
        <h3>📺 表示器プレビュー</h3>
        <div id="display-preview">
          <div class="led-board">
            <div id="display-text" class="led-grid"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 16x16 漢字フォントエディタ モーダル -->
  <div id="font-editor-modal" class="modal-overlay">
    <div class="modal-content-normal" style="max-width: 480px; text-align: center;">
      <h3 style="color: #ff00ff; font-size: 13px; margin-bottom: 4px;">🔤 16x16ドット 漢字/文字エディタ</h3>
      <div style="display:flex; gap:4px; align-items:center; margin-bottom:6px;">
        <label style="font-size:10px;">編集文字:</label>
        <input type="text" id="font-target-char" maxlength="1" value="京" style="width:40px; text-align:center; font-size:14px; font-weight:bold; margin:0; padding:2px;" onchange="loadCharToEditor(this.value)">
        <button onclick="clearFontMatrix()" style="width:auto; padding:2px 6px; font-size:10px; background:#d9534f; margin:0;">全消去</button>
        <button onclick="fillFontMatrix()" style="width:auto; padding:2px 6px; font-size:10px; background:#007acc; margin:0;">全点灯</button>
      </div>
      
      <div id="editor-grid-container" class="editor-grid-container">
        <div id="editor-matrix" class="editor-grid-16"></div>
      </div>

      <div style="display: flex; gap: 6px; margin-top: 10px;">
        <button onclick="saveCurrentFontChar()" style="flex:1; background: #28a745; font-size:10px; padding:6px;">💾 フォント保存</button>
        <button onclick="closeFontEditorModal()" style="flex:1; background: #6c757d; font-size:10px; padding:6px;">閉じる</button>
      </div>
    </div>
  </div>

  <!-- 区間修正用モーダル -->
  <div id="trim-modal" class="modal-overlay">
    <div class="modal-content-normal">
      <h3 style="color: #ff9900; font-size:13px;">✂️ 区間修正</h3>
      <p style="font-size: 11px; color: #ccc;">対象: <b id="trim-target-line-name" style="color:#00aaff;">-</b></p>
      <div>
        <label style="font-size: 10px;">削除方向:</label>
        <select id="trim-direction" style="font-size:10px; padding:2px;">
          <option value="end">終点側から削る</option>
          <option value="start">始点側から削る</option>
        </select>
      </div>
      <div>
        <label style="font-size: 10px;">削るポイント数 (全 <span id="trim-total-pts">0</span> 点):</label>
        <input type="number" id="trim-count-input" value="5" min="1" max="500" style="font-size:10px; padding:2px;">
      </div>
      <div style="display: flex; gap: 6px; margin-top: 6px;">
        <button onclick="executeTrimLine()" style="flex:1; background:#d9534f; font-size:10px; padding:4px;">✂️ 実行</button>
        <button onclick="closeTrimModal()" style="flex:1; background:#6c757d; font-size:10px; padding:4px;">キャンセル</button>
      </div>
    </div>
  </div>

  <!-- 共有モーダル -->
  <div id="share-modal" class="modal-overlay">
    <div class="modal-content-normal">
      <h3 style="color: #20c997; font-size:13px;">🌐 サーバーに共有</h3>
      <p style="font-size: 11px; color: #ccc;">全員の共通DBに登録します。<br><b style="color:#ffcc00;">※15駅以上必要（現在: <span id="share-station-count">0</span>駅）</b></p>
      <div>
        <label style="font-size: 10px;">作品名:</label>
        <input type="text" id="share-work-name" placeholder="例: 連絡鉄道網" style="font-size:10px; padding:2px;">
      </div>
      <div>
        <label style="font-size: 10px;">タグ (カンマ区切り):</label>
        <input type="text" id="share-work-tags" placeholder="例: 三陸, 湾岸" style="font-size:10px; padding:2px;">
      </div>
      <div style="display: flex; gap: 6px; margin-top: 6px;">
        <button onclick="executeShare()" style="flex:1; background:#28a745; font-size:10px; padding:4px;">🚀 登録</button>
        <button onclick="closeShareModal()" style="flex:1; background:#6c757d; font-size:10px; padding:4px;">キャンセル</button>
      </div>
    </div>
  </div>

  <!-- 閲覧モーダル -->
  <div id="browse-modal" class="modal-overlay">
    <div class="modal-content-fullscreen">
      <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #444; padding-bottom: 6px;">
        <h3 style="color: #ffc107; font-size:13px;">📖 サーバー作品一覧</h3>
        <button onclick="closeBrowseModal()" style="width: auto; padding: 2px 8px; background:#6c757d; font-size:11px;">✖ 閉じる</button>
      </div>
      
      <div style="display: flex; gap: 4px; background: #1e1e1e; padding: 6px; border-radius: 4px; align-items: center; flex-wrap: wrap;">
        <div style="flex:2; min-width:120px;"><input type="text" id="search-name-input" placeholder="🔍 検索..." oninput="renderBrowseWorks()" style="margin:0; font-size:10px; padding:2px;"></div>
        <div style="flex:2; min-width:120px;"><input type="text" id="search-tag-input" placeholder="🏷️ タグ..." oninput="renderBrowseWorks()" style="margin:0; font-size:10px; padding:2px;"></div>
        <div style="flex:1.5; min-width:110px;">
          <select id="sort-select" onchange="renderBrowseWorks()" style="margin:0; font-size:10px; padding:2px;">
            <option value="likes">❤️ いいね順</option>
            <option value="stations">🚉 駅数順</option>
            <option value="newest">🆕 新しさ順</option>
          </select>
        </div>
        <div style="flex:1.5; min-width:110px;">
          <select id="filter-select" onchange="renderBrowseWorks()" style="margin:0; font-size:10px; padding:2px;">
            <option value="all">🌍 すべて</option>
            <option value="mine">👤 自作</option>
            <option value="liked">❤️ いいね済</option>
          </select>
        </div>
      </div>
      
      <div id="browse-works-container" class="works-grid-container">
        <div style="grid-column: span 5; text-align: center; color: #888; padding: 20px; font-size:11px;">データ取得中...</div>
      </div>
    </div>
  </div>

  <!-- プレビューモーダル -->
  <div id="preview-modal" class="modal-overlay">
    <div class="modal-content-normal" style="max-width: 800px; height: 75vh;">
      <h3 id="preview-title" style="color: #00aaff; font-size:13px;">👁️ プレビュー</h3>
      <div id="preview-map-container" style="flex: 1; background: #111; border-radius: 4px; overflow: hidden; position: relative;"></div>
      <div style="display: flex; justify-content: flex-end; margin-top: 6px;">

  <script>
    // --- 路線追従・種別連動・16x16漢字エディタ搭載版 (v4.50) ---

    const CLOUD_API_BIN_URL = 'https://api.jsonbin.io/v3/b/66185c78ad19ca34f860273a';

    let myUserId = localStorage.getItem('transit_my_user_id');
    if (!myUserId) {
      myUserId = 'user_' + Math.random().toString(36).substring(2, 10);
      localStorage.setItem('transit_my_user_id', myUserId);
    }
    let myCreatedWorkIds = JSON.parse(localStorage.getItem('transit_my_created_works') || '{}');
    let userLikedWorks = JSON.parse(localStorage.getItem('transit_user_likes') || '{}');
    let serverWorksCache = [];

    // --- 16x16 フォントデータ管理 ---
    let customFontData = JSON.parse(localStorage.getItem('transit_custom_font_data') || '{}');

    function openFontEditorModal() {
      document.getElementById('font-editor-modal').style.display = 'flex';
      initFontEditorGrid();
      loadCharToEditor(document.getElementById('font-target-char').value);
    }
    function closeFontEditorModal() {
      document.getElementById('font-editor-modal').style.display = 'none';
      let activeT = getActiveTrain();
      if (activeT) renderLEDPreview(activeT);
    }

    let editorPixels = [];
    function initFontEditorGrid() {
      const matrix = document.getElementById('editor-matrix');
      matrix.innerHTML = '';
      editorPixels = [];
      let isDrawing = false;
      let drawState = true;

      for (let r = 0; r < 16; r++) {
        editorPixels[r] = [];
        for (let c = 0; c < 16; c++) {
          const px = document.createElement('div');
          px.className = 'editor-pixel';
          px.dataset.row = r;
          px.dataset.col = c;

          px.addEventListener('mousedown', (e) => {
            isDrawing = true;
            drawState = !px.classList.contains('on');
            setPixelState(r, c, drawState);
            e.preventDefault();
          });
          px.addEventListener('mouseenter', () => {
            if (isDrawing) setPixelState(r, c, drawState);
          });

          matrix.appendChild(px);
          editorPixels[r][c] = px;
        }
      }
      window.addEventListener('mouseup', () => { isDrawing = false; });
    }

    function setPixelState(r, c, state) {
      if (editorPixels[r] && editorPixels[r][c]) {
        editorPixels[r][c].classList.toggle('on', state);
      }
    }

    function clearFontMatrix() {
      for (let r = 0; r < 16; r++) {
        for (let c = 0; c < 16; c++) setPixelState(r, c, false);
      }
    }

    function fillFontMatrix() {
      for (let r = 0; r < 16; r++) {
        for (let c = 0; c < 16; c++) setPixelState(r, c, true);
      }
    }

    function loadCharToEditor(char) {
      if (!char || char.length === 0) return;
      clearFontMatrix();
      let matrixArr = customFontData[char];
      if (matrixArr && Array.isArray(matrixArr) && matrixArr.length === 16) {
        for (let r = 0; r < 16; r++) {
          let rowVal = matrixArr[r];
          for (let c = 0; c < 16; c++) {
            let bit = (rowVal & (1 << (15 - c))) !== 0;
            setPixelState(r, c, bit);
          }
        }
      }
    }

    function saveCurrentFontChar() {
      let char = document.getElementById('font-target-char').value.charAt(0);
      if (!char) return alert('文字を入力してください');
      let matrixArr = [];
      for (let r = 0; r < 16; r++) {
        let rowVal = 0;
        for (let c = 0; c < 16; c++) {
          if (editorPixels[r][c].classList.contains('on')) {
            rowVal |= (1 << (15 - c));
          }
        }
        matrixArr.push(rowVal);
      }
      customFontData[char] = matrixArr;
      localStorage.setItem('transit_custom_font_data', JSON.stringify(customFontData));
      alert(`文字「${char}」の16x16フォントを保存しました！`);
      closeFontEditorModal();
    }


    async function dbFetchAllWorksFromServer() {
      try {
        let res = await fetch(CLOUD_API_BIN_URL, {
          headers: { 'X-Access-Key': '$2a$10$7Z8Kq9Z8Kq9Z8Kq9Z8Kq9O...' }
        });
        if (!res.ok) throw new Error('サーバー接続エラー');
        let data = await res.json();
        let works = data.record && Array.isArray(data.record.works) ? data.record.works : [];
        serverWorksCache = works;
        return works;
      } catch (e) {
        let localFallback = [];
        for(let i=0; i<localStorage.length; i++) {
          let k = localStorage.key(i);
          if(k && k.startsWith('fallback_work_')) {
            try { localFallback.push(JSON.parse(localStorage.getItem(k))); } catch(err){}
          }
        }
        return serverWorksCache.length > 0 ? serverWorksCache : localFallback;
      }
    }

    async function dbSaveWorkToServer(workData) {
      try {
        let currentWorks = await dbFetchAllWorksFromServer();
        let existingIdx = currentWorks.findIndex(w => w.id === workData.id);
        if (existingIdx >= 0) currentWorks[existingIdx] = workData;
        else currentWorks.unshift(workData);

        let res = await fetch(CLOUD_API_BIN_URL, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', 'X-Access-Key': '$2a$10$7Z8Kq9Z8Kq9Z8Kq9Z8Kq9O...' },
          body: JSON.stringify({ works: currentWorks })
        });
        if (!res.ok) throw new Error('サーバー保存失敗');
        serverWorksCache = currentWorks;
        return true;
      } catch (e) {
        localStorage.setItem(`fallback_work_${workData.id}`, JSON.stringify(workData));
        return true;
      }
    }

    function simplifyPoints(points, minDistanceMeters = 50) {
      if (!points || points.length <= 2) return points;
      let simplified = [points[0]];
      let lastPoint = points[0];

      for (let i = 1; i < points.length - 1; i++) {
        let p = points[i];
        let latlng = L.latLng(p.lat || p[0], p.lng || p[1]);
        let lastLatlng = L.latLng(lastPoint.lat || lastPoint[0], lastPoint.lng || lastPoint[1]);
        
        if (latlng.distanceTo(lastLatlng) >= minDistanceMeters) {
          simplified.push(p);
          lastPoint = p;
        }
      }
      simplified.push(points[points.length - 1]);
      return simplified;
    }

    function optimizeAllLinesPoints() {
      if (lines.length === 0) return alert('間引く路線がありません。');
      let interval = parseFloat(document.getElementById('simplify-distance-input').value) || 50;
      let before = 0, after = 0;
      lines.forEach(l => {
        before += l.points.length;
        l.points = simplifyPoints(l.points, interval);
        after += l.points.length;
        updateLinePolylines(l);
      });
      alert(`🧹 間引き間隔 [${interval}m] で整理しました！\n（総ポイント数: ${before}点 ➔ ${after}点）`);
    }

    const map = L.map('map', { dragging: true, preferCanvas: true }).setView([39.45, 141.95], 10);

    L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png', {
      attribution: '&copy; 国土地理院',
      maxZoom: 18,
      crossOrigin: true,
      errorTileUrl: ''
    }).addTo(map);

    let currentMode = 'pan';
    let lines = [];
    let folders = [];
    let plannedLines = [];
    
    let expressTypes = [
      { id: 'express_local_fixed', name: '各駅停車', color: '#007acc', isFixed: true }
    ];
    let expressStops = {}; 
    
    let currentDrawingPoints = [];
    let currentPolyline = null;
    let activePlanState = { active: false, targetLineId: null, rawPoints: [], currentIndex: 0, ghostPolyline: null, solidPolyline: null, isLocked: false };

    let stations = [];
    let trainList = [];
    let activeTrainId = null;
    let currentCaptureMode = 'deformed';
    let currentZoomScale = 1.0, panX = 0, panY = 0, isPanning = false, startPanX = 0, startPanY = 0;

    let testRunState = { isRunning: false, timer: null, segments: [], currentSegIdx: 0, currentSegDist: 0, stopTimer: 0 };
    let trimTargetLineId = null;
    let transferFirstStation = null;

    const lineColors = ['#007acc', '#e6194B', '#3cb44b', '#ffe119', '#911eb4', '#f58231'];

    function updateKeyGuide(mode) {
      const box = document.getElementById('key-guide-box');
      let guideText = "";
      let activeExp = expressTypes.find(e => e.id === activeExpressConfigId);
      let expName = activeExp ? activeExp.name : '各駅停車';

      switch (mode) {
        case 'pan': guideText = "✋ 地図移動"; break;
        case 'plan': guideText = "📐 計画線 (ドラッグ)"; break;
        case 'express-config': guideText = `⚡ ${expName} 停車設定`; break;
        case 'station': guideText = "🚉 駅配置"; break;
        case 'transfer': guideText = "🔄 乗換統合"; break;
        case 'start': guideText = "🟢 始点設定"; break;
        case 'via': guideText = "🟨 経由設定"; break;
        case 'end': guideText = "🔴 終点設定"; break;
        default: guideText = "💡 操作中"; break;
      }
      box.innerHTML = `<span>${guideText}</span>`;
    }

    let isTracking = false;
    let isAudioOn = false;

    function toggleTracking() {
      isTracking = !isTracking;
      const btn = document.getElementById('track-btn');
      btn.innerText = isTracking ? '🎥 追尾ON' : '🎥 追尾';
      btn.classList.toggle('toggle-on', isTracking);
    }

    function toggleAudio() {
      isAudioOn = !isAudioOn;
      const btn = document.getElementById('audio-btn');
      btn.innerText = isAudioOn ? '🔊 音声ON' : '🔊 音声';
      btn.classList.toggle('toggle-on', isAudioOn);
    }

    function getNearestLineAndIndexOnLine(latlng, lineObj) {
      let minDist = Infinity, minIdx = 0;
      for (let i = 0; i < lineObj.points.length; i++) {
        let d = latlng.distanceTo(lineObj.points[i]);
        if (d < minDist) { minDist = d; minIdx = i; }
      }
      return { index: minIdx, dist: minDist };
    }

    function findLineSegmentBetweenStations(stA, stB) {
      for (let line of lines) {
        let minDistA = Infinity, minDistB = Infinity;
        let idxA = 0, idxB = 0;

        for (let i = 0; i < line.points.length; i++) {
          let pt = line.points[i];
          let dA = stA.latlng.distanceTo(pt);
          let dB = stB.latlng.distanceTo(pt);
          if (dA < minDistA) { minDistA = dA; idxA = i; }
          if (dB < minDistB) { minDistB = dB; idxB = i; }
        }

        if (minDistA < 500 && minDistB < 500) {
          let pts = [];
          if (idxA < idxB) pts = line.points.slice(idxA, idxB + 1);
          else pts = line.points.slice(idxB, idxA + 1).reverse();
          return pts.map(p => L.latLng(p.lat || p[0], p.lng || p[1]));
        }
      }
      return [stA.latlng, stB.latlng];
    }

    function toggleTestRun() {
      if (testRunState.isRunning) stopTestRun();
      else startTestRun();
    }

    function startTestRun() {
      let t = getActiveTrain();
      if (!t || !t.timetable || t.timetable.length < 2) {
        alert('先に対象列車のダイヤ（時刻表）を生成してください！');
        return;
      }

      let segments = [];
      let timetable = t.timetable;

      for (let i = 0; i < timetable.length - 1; i++) {
        let fromSt = timetable[i].station;
        let toSt = timetable[i+1].station;
        let rawPoints = findLineSegmentBetweenStations(fromSt, toSt);

        let subDistances = [0];
        let totalDist = 0;
        for (let j = 0; j < rawPoints.length - 1; j++) {
          let d = rawPoints[j].distanceTo(rawPoints[j+1]);
          totalDist += d;
          subDistances.push(totalDist);
        }

        let maxSpeedMps = ((t.speedKmH || 60) * 1000) / 3600;
        segments.push({
          fromStation: fromSt, toStation: toSt, points: rawPoints,
          subDistances: subDistances, totalDistance: totalDist || 1,
          maxSpeed: maxSpeedMps, stopTime: (i < timetable.length - 2) ? (t.stopTimeSec || 3) * 20 : 0
        });
      }

      testRunState.segments = segments;
      testRunState.currentSegIdx = 0;
      testRunState.currentSegDist = 0;
      testRunState.stopTimer = 0;
      testRunState.isRunning = true;

      const btn = document.getElementById('test-run-btn');
      btn.innerText = '⏹ 停止';
      btn.style.background = '#d9534f';
      btn.style.color = '#fff';

      let initPt = segments[0].points[0];
      if (!t.marker) {
        t.marker = L.marker(initPt, {
          icon: L.divIcon({
            className: 'custom-train-icon',
            html: `<div class="train-marker"></div>`,
            iconSize: [14, 14], iconAnchor: [7, 7]
          })
        }).addTo(map);
      } else {
        t.marker.setLatLng(initPt);
        t.marker.addTo(map);
      }

      testRunState.timer = setInterval(() => {
        if (!testRunState.isRunning) return;
        let seg = testRunState.segments[testRunState.currentSegIdx];

        if (testRunState.stopTimer > 0) {
          testRunState.stopTimer--;
          if (testRunState.stopTimer === 0) {
            testRunState.currentSegIdx++;
            testRunState.currentSegDist = 0;
            if (testRunState.currentSegIdx >= testRunState.segments.length) {
              stopTestRun();
              alert('試運転完了！');
            }
          }
          return;
        }

        let stepDist = seg.maxSpeed * 0.05;
        testRunState.currentSegDist += stepDist;

        if (testRunState.currentSegDist >= seg.totalDistance) {
          testRunState.currentSegDist = seg.totalDistance;
          let pt = seg.points[seg.points.length - 1];
          t.marker.setLatLng(pt);
          if (isTracking) map.panTo(pt, { animate: true, duration: 0.05 });

          if (seg.stopTime > 0) {
            testRunState.stopTimer = seg.stopTime;
          } else {
            testRunState.currentSegIdx++;
            testRunState.currentSegDist = 0;
            if (testRunState.currentSegIdx >= testRunState.segments.length) {
              stopTestRun();
              alert('試運転完了！');
            }
          }
          return;
        }

        let targetDist = testRunState.currentSegDist;
        let pIdx = 0;
        for (let i = 0; i < seg.subDistances.length - 1; i++) {
          if (targetDist >= seg.subDistances[i] && targetDist <= seg.subDistances[i+1]) {
            pIdx = i;
            break;
          }
        }

        let dStart = seg.subDistances[pIdx], dEnd = seg.subDistances[pIdx+1];
        let ratio = (dEnd - dStart > 0) ? (targetDist - dStart) / (dEnd - dStart) : 0;
        let ptA = seg.points[pIdx], ptB = seg.points[pIdx+1];
        let curLat = ptA.lat + (ptB.lat - ptA.lat) * ratio;
        let curLng = ptA.lng + (ptB.lng - ptA.lng) * ratio;
        let currentLatLng = L.latLng(curLat, curLng);

        t.marker.setLatLng(currentLatLng);
        if (isTracking) map.panTo(currentLatLng, { animate: true, duration: 0.05 });
      }, 50);
    }

    function stopTestRun() {
      testRunState.isRunning = false;
      if (testRunState.timer) clearInterval(testRunState.timer);
      const btn = document.getElementById('test-run-btn');
      btn.innerText = '▶ 試運転';
      btn.style.background = '#00ffcc';
      btn.style.color = '#000';
    }

    function openShareModal() {
      let currentStationCount = stations.length;
      document.getElementById('share-station-count').innerText = currentStationCount;
      if (currentStationCount < 15) {
        alert(`サーバー共有には【15駅以上】必要です。（現在: ${currentStationCount}駅）`);
        return;
      }
      document.getElementById('share-modal').style.display = 'flex';
      document.getElementById('share-work-name').value = '';
      document.getElementById('share-work-tags').value = '';
    }
    function closeShareModal() { document.getElementById('share-modal').style.display = 'none'; }

    async function executeShare() {
      try {
        if (stations.length < 15) return alert('15駅未満のため共有できません。');
        let titleInput = document.getElementById('share-work-name').value.trim();
        let tagsInput = document.getElementById('share-work-tags').value.trim();
        let interval = parseFloat(document.getElementById('simplify-distance-input').value) || 50;
        
        let title = titleInput || '名無しの作品';
        let tags = tagsInput ? tagsInput.split(',').map(t => t.trim()).filter(Boolean) : [];

        let optimizedLines = lines.map(l => ({
          id: l.id, name: l.name, color: l.color, folderId: l.folderId, isBranch: l.isBranch,
          points: simplifyPoints(l.points, interval).map(p => [Number((p.lat || p[0]).toFixed(5)), Number((p.lng || p[1]).toFixed(5))])
        }));

        let optimizedStations = stations.map(s => ({
          id: s.id, name: s.name,
          latlng: [Number(s.latlng.lat.toFixed(5)), Number(s.latlng.lng.toFixed(5))],
          isHub: s.isHub || false, mergedStationIds: s.mergedStationIds || [], connectedLineIds: s.connectedLineIds || []
        }));

        let workId = 'work_' + Date.now();
        let workData = {
          id: workId, authorId: myUserId, title, tags, likes: 0,
          stationCount: optimizedStations.length, timestamp: Date.now(),
          payload: {
            folders: folders.map(f => ({ id: f.id, name: f.name, color: f.color, isBranchFolder: f.isBranchFolder })),
            lines: optimizedLines, stations: optimizedStations, expressTypes, expressStops
          }
        };

        await dbSaveWorkToServer(workData);
        myCreatedWorkIds[workId] = true;
        localStorage.setItem('transit_my_created_works', JSON.stringify(myCreatedWorkIds));

        closeShareModal();
        alert(`「${title}」をサーバーに共有しました！`);
      } catch (err) {
        alert('共有エラー: ' + err.message);
      }
    }

    async function openBrowseModal() {
      document.getElementById('search-name-input').value = '';
      document.getElementById('search-tag-input').value = '';
      document.getElementById('sort-select').value = 'likes';
      document.getElementById('filter-select').value = 'all';
      document.getElementById('browse-modal').style.display = 'flex';
      await renderBrowseWorks();
    }
    function closeBrowseModal() { document.getElementById('browse-modal').style.display = 'none'; }

    async function renderBrowseWorks() {
      let container = document.getElementById('browse-works-container');
      container.innerHTML = '<div style="grid-column: span 5; text-align: center; color: #888; padding: 20px; font-size:11px;">読込中...</div>';

      let allWorks = await dbFetchAllWorksFromServer();
      let nameQuery = document.getElementById('search-name-input').value.trim().toLowerCase();
      let tagQuery = document.getElementById('search-tag-input').value.trim().toLowerCase();
      let sortBy = document.getElementById('sort-select').value;
      let filterBy = document.getElementById('filter-select').value;

      let filtered = allWorks.filter(w => {
        let matchName = w.title.toLowerCase().includes(nameQuery);
        let matchTag = tagQuery === '' || (w.tags && w.tags.some(t => t.toLowerCase().includes(tagQuery)));
        if (!matchName || !matchTag) return false;
        if (filterBy === 'mine') return myCreatedWorkIds[w.id] || w.authorId === myUserId;
        if (filterBy === 'liked') return !!userLikedWorks[w.id];
        return true;
      });

      filtered.sort((a, b) => {
        if (sortBy === 'likes') return (b.likes || 0) - (a.likes || 0);
        if (sortBy === 'stations') return (b.stationCount || 0) - (a.stationCount || 0);
        if (sortBy === 'newest') return (b.timestamp || 0) - (a.timestamp || 0);
        return 0;
      });

      container.innerHTML = '';
      if (filtered.length === 0) {
        container.innerHTML = '<p style="font-size: 11px; color: #888; text-align: center; grid-column: span 5; padding: 20px;">該当する作品なし</p>';
        return;
      }

      filtered.forEach(w => {
        let isLiked = !!userLikedWorks[w.id];
        let isMine = myCreatedWorkIds[w.id] || w.authorId === myUserId;
        let sCount = w.stationCount || (w.payload && w.payload.stations ? w.payload.stations.length : 0);
        let card = document.createElement('div');
        card.className = 'work-card';
        let tagsHtml = w.tags ? w.tags.map(tag => `<span class="tag-badge">#${tag}</span>`).join('') : '';

        card.innerHTML = `
          <div>
            <div class="work-card-header">
              <b style="font-size: 11px; color: #00ffcc; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:90px;" title="${w.title}">${w.title}</b>
              <span style="font-size: 9px; color: #aaa;">❤️ ${w.likes || 0}</span>
            </div>
            <div style="font-size: 9px; color: #ffcc00; margin:1px 0;">🚉 ${sCount}駅 ${isMine ? '[自作]' : ''}</div>
            <div style="height:16px; overflow:hidden;">${tagsHtml}</div>
          </div>
          <div style="display: flex; flex-direction: column; gap: 2px;">
            <button onclick="toggleLikeWork('${w.id}')" style="font-size:8px; padding:2px; background:${isLiked ? '#d9534f' : '#333'};">${isLiked ? '❤️ 解除' : '🤍 いいね'}</button>

    async function toggleLikeWork(workId) {
      let allWorks = await dbFetchAllWorksFromServer();
      let work = allWorks.find(w => w.id === workId);
      if (!work) return;

      if (userLikedWorks[workId]) {
        userLikedWorks[workId] = false;
        work.likes = Math.max(0, (work.likes || 1) - 1);
      } else {
        userLikedWorks[workId] = true;
        work.likes = (work.likes || 0) + 1;
      }

      await dbSaveWorkToServer(work);
      localStorage.setItem('transit_user_likes', JSON.stringify(userLikedWorks));
      await renderBrowseWorks();
    }

    async function previewWork(workId) {
      let allWorks = await dbFetchAllWorksFromServer();

    async function loadWorkToEditor(workId, mode) {
      let allWorks = await dbFetchAllWorksFromServer();
      let work = allWorks.find(w => w.id === workId);
      if (!work) return;
      
      let isMine = myCreatedWorkIds[workId] || work.authorId === myUserId;
      if (!userLikedWorks[workId] && !isMine) {
        alert('他の人の作品を読み込むには、まず「いいね」を押してください！');
        return;
      }

      if (mode === 'overwrite') {
        lines.forEach(l => { if (l.polyline) map.removeLayer(l.polyline); if (l.borderPolyline) map.removeLayer(l.borderPolyline); });
        stations.forEach(s => map.removeLayer(s.marker));
        folders = []; lines = []; stations = []; trainList = []; 
        expressTypes = [{ id: 'express_local_fixed', name: '各駅停車', color: '#007acc', isFixed: true }]; 
        expressStops = {};
      }

      let data = work.payload;
      if (data.expressTypes) data.expressTypes.forEach(et => { if (!expressTypes.some(x => x.name === et.name)) expressTypes.push(et); });
      if (data.expressStops) for (let k in data.expressStops) { if (!expressStops[k]) expressStops[k] = {}; Object.assign(expressStops[k], data.expressStops[k]); }
      if (data.folders) data.folders.forEach(f => { if (!folders.some(x => x.id === f.id)) folders.push(f); });
      if (data.lines) data.lines.forEach(l => { l.points = l.points.map(p => L.latLng(p[0], p[1])); lines.push(l); updateLinePolylines(l); });
      if (data.stations) data.stations.forEach(s => {
        const latlng = Array.isArray(s.latlng) ? L.latLng(s.latlng[0], s.latlng[1]) : s.latlng;
        const marker = L.marker(latlng, { icon: createStationMarkerIcon('各駅停車', s.isHub, 'stop'), draggable: true }).addTo(map);
        marker.bindTooltip(s.name, { permanent: true, direction: 'top' });
        let newSt = { id: s.id || (Date.now()+Math.random()), name: s.name, marker, latlng: marker.getLatLng(), isHub: s.isHub||false, mergedStationIds: s.mergedStationIds||[], connectedLineIds: s.connectedLineIds||[] };
        stations.push(newSt);
        marker.on('click', (evt) => handleStationClick(evt, newSt));
      });

      sortExpressTypes();
      renderLineList();
      if (trainList.length === 0) addNewTrain();
      closeBrowseModal();
      alert(`「${work.title}」を読み込みました！`);
    }

            if (data.folders) data.folders.forEach(f => { if (!folders.some(x => x.id === f.id)) folders.push(f); });
            if (data.lines) data.lines.forEach(l => { l.points = l.points.map(p => L.latLng(p[0], p[1])); lines.push(l); updateLinePolylines(l); });
            if (data.stations) data.stations.forEach(s => {

              const marker = L.marker(latlng, { icon: createStationMarkerIcon('各駅停車', s.isHub, 'stop'), draggable: true }).addTo(map);

    function zoomPreview(delta) { currentZoomScale = Math.min(Math.max(0.2, currentZoomScale + delta), 4.0); updateZoomTransform(); }

    function updateZoomTransform() {

      document.getElementById('zoom-level-label').innerText = `${Math.round(currentZoomScale * 100)}%`;

    captureContainer.addEventListener('mousedown', (e) => { isPanning = true; startPanX = e.clientX - panX; startPanY = e.clientY - panY; });

    function captureRealMap() {
      html2canvas(document.getElementById('map'), { useCORS: true, allowTaint: false, logging: false, scale: 1.2 })
